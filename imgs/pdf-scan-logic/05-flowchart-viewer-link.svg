<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">原文与 OCR 文字联动 Viewer</title>
  <desc id="desc">把百度坐标数据归一化并注入 Viewer，使用 PDF.js、SVG 多边形、marked 和 DOMPurify 实现原文与 Markdown 的双向高亮。</desc>
  <defs>
    <linearGradient id="aluminum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF1F4"/><stop offset="0.5" stop-color="#C7CDD3"/><stop offset="1" stop-color="#9EA6AE"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#374151" flood-opacity="0.20"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M1 1 L9 4 L1 7" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text { font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #222222; }
    .title { font-size: 38px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 700; text-anchor: middle; }
    .small { font-size: 16px; font-weight: 500; text-anchor: middle; fill: #4B5563; }
    .mini { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .ink { fill: none; stroke: #222222; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="675" fill="#F3F4F6"/>
  <rect x="38" y="24" width="1124" height="626" rx="34" fill="url(#aluminum)" filter="url(#shadow)"/>
  <rect x="57" y="43" width="1086" height="588" rx="24" fill="#FFFFFF" stroke="#8F98A1" stroke-width="4"/>
  <circle cx="75" cy="61" r="6" fill="#7B848D"/><circle cx="1125" cy="61" r="6" fill="#7B848D"/><circle cx="75" cy="613" r="6" fill="#7B848D"/><circle cx="1125" cy="613" r="6" fill="#7B848D"/>
  <rect x="424" y="627" width="352" height="14" rx="7" fill="#A6ADB5"/>
  <text x="600" y="98" class="title" text-anchor="middle">原文与 OCR 文字如何联动</text>
  <path d="M370 114 C470 107 730 121 830 112" class="ink" stroke-width="4"/>

  <path d="M264 185 C282 180 298 180 316 185" class="ink" marker-end="url(#arrow)"/>
  <path d="M468 185 C486 180 502 180 520 185" class="ink" marker-end="url(#arrow)"/>
  <path d="M672 185 C690 180 706 180 724 185" class="ink" marker-end="url(#arrow)"/>
  <path d="M876 185 C894 180 910 180 928 185" class="ink" marker-end="url(#arrow)"/>

  <g transform="rotate(-1 180 185)">
    <rect x="96" y="143" width="168" height="84" rx="15" fill="#D9ECFF" stroke="#222222" stroke-width="2.8"/>
    <text x="180" y="178" class="label">坐标 JSON</text><text x="180" y="205" class="small">parse_result_url</text>
  </g>
  <g transform="rotate(1 392 185)">
    <rect x="316" y="143" width="152" height="84" rx="15" fill="#FFFFFF" stroke="#222222" stroke-width="2.8"/>
    <text x="392" y="178" class="label">归一化</text><text x="392" y="205" class="small">页 / 文字 / 多边形</text>
  </g>
  <g transform="rotate(-1 596 185)">
    <rect x="520" y="143" width="152" height="84" rx="15" fill="#FFF2A8" stroke="#222222" stroke-width="2.8"/>
    <text x="596" y="178" class="label">注入模板</text><text x="596" y="205" class="small">数据 + 原文 + MD</text>
  </g>
  <g transform="rotate(1 800 185)">
    <rect x="724" y="143" width="152" height="84" rx="15" fill="#FFFFFF" stroke="#222222" stroke-width="2.8"/>
    <text x="800" y="178" class="label">上传 Viewer</text><text x="800" y="205" class="small">viewer.html</text>
  </g>
  <g transform="rotate(-1 1004 185)">
    <rect x="928" y="143" width="152" height="84" rx="15" fill="#D9ECFF" stroke="#222222" stroke-width="2.8"/>
    <text x="1004" y="178" class="label">浏览器打开</text><text x="1004" y="205" class="small">双栏联动</text>
  </g>

  <path d="M1004 227 C1004 258 920 268 878 290" class="ink" marker-end="url(#arrow)"/>
  <g transform="rotate(-0.5 342 420)">
    <rect x="100" y="280" width="484" height="284" rx="18" fill="#FFFFFF" stroke="#222222" stroke-width="3"/>
    <rect x="126" y="310" width="432" height="44" rx="10" fill="#D9ECFF"/>
    <text x="342" y="339" class="label">左侧：原始 PDF 页面</text>
    <rect x="167" y="376" width="350" height="154" rx="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.6"/>
    <path d="M195 402 H438 M195 426 H465 M195 450 H420 M195 474 H470 M195 498 H405" class="ink" stroke-width="2.2"/>
    <path d="M186 389 L477 389 L477 438 L186 438 Z" fill="#FFF2A8" fill-opacity="0.62" stroke="#222222" stroke-width="2.8" stroke-dasharray="8 6"/>
    <text x="342" y="553" class="mini">PDF.js 渲染 + SVG polygon 覆盖</text>
  </g>
  <g transform="rotate(0.5 858 420)">
    <rect x="616" y="280" width="484" height="284" rx="18" fill="#FFFFFF" stroke="#222222" stroke-width="3"/>
    <rect x="642" y="310" width="432" height="44" rx="10" fill="#FFF2A8"/>
    <text x="858" y="339" class="label">右侧：最终 Markdown</text>
    <path d="M676 390 H1016 M676 421 H986 M676 452 H1030 M676 483 H964 M676 514 H1003" class="ink" stroke-width="2.4"/>
    <rect x="668" y="371" width="358" height="70" rx="8" fill="#D9ECFF" fill-opacity="0.72" stroke="#222222" stroke-width="2.6" stroke-dasharray="7 6"/>
    <text x="858" y="553" class="mini">marked 渲染 + DOMPurify 净化</text>
  </g>
  <path d="M548 404 C590 380 610 380 652 404" class="ink" marker-end="url(#arrow)"/>
  <path d="M652 470 C610 494 590 494 548 470" class="ink" marker-end="url(#arrow)"/>
  <g transform="rotate(-1 600 439)">
    <rect x="550" y="414" width="100" height="50" rx="12" fill="#FFF2A8" stroke="#222222" stroke-width="2.4"/>
    <text x="600" y="445" class="mini">entry_id</text>
  </g>
  <g transform="rotate(-1 600 590)">
    <rect x="430" y="570" width="340" height="34" rx="10" fill="#FFF2A8"/>
    <text x="600" y="593" class="small">悬停高亮 · 点击固定 · 跨页自动切换</text>
  </g>
</svg>
