<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PDF 扫描件处理全链路</title>
  <desc id="desc">从扫描件输入、Flask 接收、OSS 上传、百度 OCR、结果转存到 Markdown 和可视化 Viewer 的完整流程。</desc>
  <defs>
    <linearGradient id="aluminum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF1F4"/>
      <stop offset="0.48" stop-color="#C6CCD2"/>
      <stop offset="1" stop-color="#9EA6AE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#374151" flood-opacity="0.20"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M1 1 L9 4 L1 7" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #222222; }
    .title { font-size: 38px; font-weight: 700; }
    .step { font-size: 23px; font-weight: 700; text-anchor: middle; }
    .small { font-size: 17px; font-weight: 500; text-anchor: middle; fill: #4B5563; }
    .card-small { font-size: 13px; font-weight: 500; text-anchor: middle; fill: #4B5563; }
    .note { font-size: 21px; font-weight: 700; text-anchor: middle; }
    .ink { fill: none; stroke: #222222; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="675" fill="#F3F4F6"/>
  <rect x="38" y="24" width="1124" height="626" rx="34" fill="url(#aluminum)" filter="url(#shadow)"/>
  <rect x="57" y="43" width="1086" height="588" rx="24" fill="#FFFFFF" stroke="#8F98A1" stroke-width="4"/>
  <circle cx="75" cy="61" r="6" fill="#7B848D"/><circle cx="1125" cy="61" r="6" fill="#7B848D"/>
  <circle cx="75" cy="613" r="6" fill="#7B848D"/><circle cx="1125" cy="613" r="6" fill="#7B848D"/>
  <rect x="424" y="627" width="352" height="14" rx="7" fill="#A6ADB5"/>

  <text x="600" y="102" class="title" text-anchor="middle">PDF 扫描件处理全链路</text>
  <path d="M382 118 C470 112 728 124 818 116" class="ink" stroke-width="4"/>
  <g transform="rotate(-1 600 155)">
    <rect x="410" y="132" width="380" height="42" rx="12" fill="#FFF2A8"/>
    <text x="600" y="160" class="small">本地输入 → 云端识别 → 持久化发布</text>
  </g>

  <path d="M228 332 C242 327 250 327 262 332" class="ink" marker-end="url(#arrow)"/>
  <path d="M398 332 C412 327 420 327 432 332" class="ink" marker-end="url(#arrow)"/>
  <path d="M568 332 C582 327 590 327 602 332" class="ink" marker-end="url(#arrow)"/>
  <path d="M738 332 C752 327 760 327 772 332" class="ink" marker-end="url(#arrow)"/>
  <path d="M908 332 C922 327 930 327 942 332" class="ink" marker-end="url(#arrow)"/>

  <g transform="rotate(-1 160 330)">
    <rect x="92" y="246" width="136" height="168" rx="18" fill="#FFFFFF" stroke="#222222" stroke-width="3"/>
    <path d="M126 278 H174 L194 298 V340 H126 Z M174 278 V299 H194" class="ink"/>
    <text x="160" y="370" class="step">扫描件</text><text x="160" y="397" class="card-small">PDF / 图片</text>
  </g>
  <g transform="rotate(1 330 330)">
    <rect x="262" y="246" width="136" height="168" rx="18" fill="#D9ECFF" stroke="#222222" stroke-width="3"/>
    <rect x="296" y="278" width="68" height="50" rx="8" class="ink"/>
    <path d="M306 291 H350 M306 303 H342 M306 315 H332" class="ink" stroke-width="2.4"/>
    <text x="330" y="370" class="step">Flask</text><text x="330" y="397" class="card-small">接收与建任务</text>
  </g>
  <g transform="rotate(-1 500 330)">
    <rect x="432" y="246" width="136" height="168" rx="18" fill="#FFFFFF" stroke="#222222" stroke-width="3"/>
    <path d="M466 305 C466 285 534 285 534 305 V333 C534 354 466 354 466 333 Z" class="ink"/>
    <path d="M466 305 C466 325 534 325 534 305 M466 320 C466 340 534 340 534 320" class="ink" stroke-width="2.4"/>
    <text x="500" y="370" class="step">OSS 输入</text><text x="500" y="397" class="card-small">公开源文件 URL</text>
  </g>
  <g transform="rotate(1 670 330)">
    <rect x="602" y="246" width="136" height="168" rx="18" fill="#FFF2A8" stroke="#222222" stroke-width="3"/>
    <circle cx="670" cy="307" r="30" class="ink"/>
    <path d="M651 307 H689 M670 288 V326 M648 289 C660 299 680 315 692 325" class="ink" stroke-width="2.4"/>
    <text x="670" y="370" class="step">百度 OCR</text><text x="670" y="397" class="card-small">异步解析任务</text>
  </g>
  <g transform="rotate(-1 840 330)">
    <rect x="772" y="246" width="136" height="168" rx="18" fill="#FFFFFF" stroke="#222222" stroke-width="3"/>
    <path d="M806 283 H874 V339 H806 Z M818 297 H861 M818 311 H855 M818 325 H846" class="ink"/>
    <text x="840" y="370" class="step">结果转存</text><text x="840" y="397" class="card-small">图片 + Markdown</text>
  </g>
  <g transform="rotate(1 1010 330)">
    <rect x="942" y="246" width="136" height="168" rx="18" fill="#D9ECFF" stroke="#222222" stroke-width="3"/>
    <rect x="972" y="280" width="76" height="54" rx="6" class="ink"/>
    <path d="M980 292 H1018 M980 305 H1038 M980 318 H1028" class="ink" stroke-width="2.4"/>
    <text x="1010" y="370" class="step">最终发布</text><text x="1010" y="397" class="card-small">Markdown + Viewer</text>
  </g>

  <g transform="rotate(-1 600 503)">
    <rect x="282" y="468" width="636" height="78" rx="16" fill="#FFF2A8" stroke="#222222" stroke-width="2.6"/>
    <text x="600" y="500" class="note">核心不是“识别一次”，而是把临时结果变成可长期访问的成果</text>
    <path d="M396 517 C458 526 745 510 807 520" class="ink" stroke-width="3"/>
  </g>
</svg>
