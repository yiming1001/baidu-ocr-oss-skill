<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">本地 PDF 上传到 OSS 的流程</title>
  <desc id="desc">浏览器上传 PDF，经 Flask 保存临时文件、校验大小与后缀、分片上传 OSS，得到百度可访问的公开 URL，并清理临时文件。</desc>
  <defs>
    <linearGradient id="aluminum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF1F4"/><stop offset="0.5" stop-color="#C7CDD3"/><stop offset="1" stop-color="#9EA6AE"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#374151" flood-opacity="0.20"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M1 1 L9 4 L1 7" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text { font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #222222; }
    .title { font-size: 38px; font-weight: 700; }
    .label { font-size: 22px; font-weight: 700; text-anchor: middle; }
    .small { font-size: 17px; font-weight: 500; text-anchor: middle; fill: #4B5563; }
    .tag { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .ink { fill: none; stroke: #222222; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="675" fill="#F3F4F6"/>
  <rect x="38" y="24" width="1124" height="626" rx="34" fill="url(#aluminum)" filter="url(#shadow)"/>
  <rect x="57" y="43" width="1086" height="588" rx="24" fill="#FFFFFF" stroke="#8F98A1" stroke-width="4"/>
  <circle cx="75" cy="61" r="6" fill="#7B848D"/><circle cx="1125" cy="61" r="6" fill="#7B848D"/><circle cx="75" cy="613" r="6" fill="#7B848D"/><circle cx="1125" cy="613" r="6" fill="#7B848D"/>
  <rect x="424" y="627" width="352" height="14" rx="7" fill="#A6ADB5"/>
  <text x="600" y="102" class="title" text-anchor="middle">本地 PDF 如何变成云端输入</text>
  <path d="M360 118 C465 111 730 125 840 116" class="ink" stroke-width="4"/>

  <path d="M235 292 C255 286 270 286 290 292" class="ink" marker-end="url(#arrow)"/>
  <path d="M445 292 C465 286 480 286 500 292" class="ink" marker-end="url(#arrow)"/>
  <path d="M650 292 C675 286 695 286 718 292" class="ink" marker-end="url(#arrow)"/>
  <path d="M862 292 C882 286 897 286 917 292" class="ink" marker-end="url(#arrow)"/>

  <g transform="rotate(-1 165 290)">
    <rect x="95" y="214" width="140" height="156" rx="18" fill="#D9ECFF" stroke="#222222" stroke-width="3"/>
    <path d="M133 243 H180 L198 262 V307 H133 Z M180 243 V263 H198" class="ink"/>
    <text x="165" y="334" class="label">选择 PDF</text><text x="165" y="357" class="small">浏览器 FormData</text>
  </g>
  <g transform="rotate(1 375 290)">
    <rect x="290" y="214" width="155" height="156" rx="18" fill="#FFFFFF" stroke="#222222" stroke-width="3"/>
    <rect x="322" y="242" width="91" height="48" rx="8" class="ink"/>
    <text x="367" y="273" class="tag">Flask</text>
    <text x="367" y="320" class="label">接收请求</text><text x="367" y="346" class="small">上限 100 MB</text>
  </g>
  <g>
    <path d="M575 211 L650 292 L575 373 L500 292 Z" fill="#FFF2A8" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
    <text x="575" y="278" class="label">后缀与大小</text><text x="575" y="306" class="label">是否合法？</text><text x="575" y="337" class="small">PDF 上限 100 MB</text>
  </g>
  <g transform="rotate(-1 790 290)">
    <rect x="718" y="214" width="144" height="156" rx="18" fill="#FFFFFF" stroke="#222222" stroke-width="3"/>
    <path d="M748 257 H832 M748 273 H832 M748 289 H820" class="ink"/>
    <circle cx="758" cy="322" r="7" fill="#FFF2A8" stroke="#222222" stroke-width="2"/><circle cx="781" cy="322" r="7" fill="#FFF2A8" stroke="#222222" stroke-width="2"/><circle cx="804" cy="322" r="7" fill="#FFF2A8" stroke="#222222" stroke-width="2"/>
    <text x="790" y="350" class="small">1 MB 分片 · 3 线程</text>
  </g>
  <g transform="rotate(1 995 290)">
    <rect x="917" y="214" width="156" height="156" rx="18" fill="#D9ECFF" stroke="#222222" stroke-width="3"/>
    <path d="M951 262 C951 242 1039 242 1039 262 V301 C1039 321 951 321 951 301 Z" class="ink"/>
    <path d="M951 262 C951 282 1039 282 1039 262 M951 281 C951 301 1039 301 1039 281" class="ink" stroke-width="2.4"/>
    <text x="995" y="343" class="label">OSS 源文件</text><text x="995" y="365" class="small">public-read URL</text>
  </g>

  <path d="M575 373 C575 414 505 420 455 444" class="ink" marker-end="url(#arrow)"/>
  <text x="522" y="404" class="tag">否</text>
  <g transform="rotate(-1 375 477)">
    <rect x="245" y="438" width="260" height="78" rx="15" fill="#FFF2A8" stroke="#222222" stroke-width="2.6"/>
    <text x="375" y="471" class="label">返回任务错误</text><text x="375" y="498" class="small">不进入 OSS 上传</text>
  </g>
  <text x="676" y="275" class="tag">是</text>
  <g transform="rotate(1 795 495)">
    <rect x="595" y="446" width="400" height="92" rx="16" fill="#D9ECFF" stroke="#222222" stroke-width="2.6"/>
    <text x="795" y="480" class="label">上传失败最多重试 3 次</text>
    <text x="795" y="510" class="small">任务结束后，finally 删除 .uploads/ 临时文件</text>
  </g>
  <path d="M692 522 C730 536 858 540 902 526" class="ink" stroke-width="2.6"/>
</svg>
